name: Dev Build

on:
  push:
    branches-ignore:
      - release

jobs:
  dev-build:
    strategy:
      matrix:
        # os: [ubuntu-latest, macos-latest, windows-latest]
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.12.2
        architecture: x64

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Extract Project Name
      shell: bash
      id: extract_project_name
      run: |
        PROJECT_NAME=$(cat pyproject.toml | grep "^name" | awk -F'"' '{print $2}')
        if [[ -z "$PROJECT_NAME" ]]; then
          echo "❌ Could not extract project name from pyproject.toml"
          exit 1
        fi
        echo "PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_ENV

    - name: Set Build Metadata
      shell: bash
      run: |
        CONFIG_FILE="src/palworld_pal_editor/config.py"
        PYPROJECT_FILE="./pyproject.toml"

        VERSION_TAG=$(git describe --tags --abbrev=0)
        RELEASE_TYPE="NIGHTLY"
        GIT_HASH=$(git rev-parse --short HEAD)
        BUILD_TIME=$(date +%s)

        REPO_OWNER="${{ github.repository_owner }}"
        REPO_NAME="${{ github.event.repository.name }}"
        BRANCH_NAME="${{ github.ref_name }}"
        REPO="${REPO_OWNER}/${REPO_NAME}@${BRANCH_NAME}"

        echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV
        echo "GIT_HASH=$GIT_HASH" >> $GITHUB_ENV

        if [[ "$RUNNER_OS" == "macOS" ]]; then
          sed -i '' "s|^VERSION = .*|VERSION = \"${VERSION_TAG}\"|" $CONFIG_FILE
          sed -i '' "s|^RELEASE_TYPE = .*|RELEASE_TYPE = \"${RELEASE_TYPE}\"|" $CONFIG_FILE
          sed -i '' "s|^BUILD_TIME = .*|BUILD_TIME = \"${BUILD_TIME}\"|" $CONFIG_FILE
          sed -i '' "s|^GIT_HASH = .*|GIT_HASH = \"${GIT_HASH}\"|" $CONFIG_FILE
          sed -i '' "s|^REPO = .*|REPO = \"${REPO}\"|" $CONFIG_FILE
          sed -i '' "s|^version = .*|version = \"${VERSION_TAG}\"|" $PYPROJECT_FILE
        else
          sed -i "s|^VERSION = .*|VERSION = \"${VERSION_TAG}\"|" $CONFIG_FILE
          sed -i "s|^RELEASE_TYPE = .*|RELEASE_TYPE = \"${RELEASE_TYPE}\"|" $CONFIG_FILE
          sed -i "s|^BUILD_TIME = .*|BUILD_TIME = \"${BUILD_TIME}\"|" $CONFIG_FILE
          sed -i "s|^GIT_HASH = .*|GIT_HASH = \"${GIT_HASH}\"|" $CONFIG_FILE
          sed -i "s|^REPO = .*|REPO = \"${REPO}\"|" $CONFIG_FILE
          sed -i "s|^version = .*|version = \"${VERSION_TAG}\"|" $PYPROJECT_FILE
        fi

        cat $CONFIG_FILE
        cat $PYPROJECT_FILE

    - name: Windows Build
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./build_executable.ps1

    - name: macOS Build
      if: runner.os == 'macOS'
      shell: bash
      run: ./build_executable.sh

    # - name: Linux AppImage Build
    #   if: runner.os == 'Linux'
    #   shell: bash
    #   run: |
    #     docker run --rm --privileged \
    #       -v ${{ github.workspace }}:/app \
    #       -w /app \
    #       ubuntu:20.04 bash -c '
    #         set -e

    #         apt update
    #         apt install -y software-properties-common curl gnupg2 ca-certificates

    #         # Python 3.11
    #         add-apt-repository -y ppa:deadsnakes/ppa
    #         apt update
    #         DEBIAN_FRONTEND=noninteractive apt install -y \
    #           python3.11 python3.11-venv python3.11-dev \
    #           build-essential git libgl1 libglib2.0-0 libfuse2 fuse \
    #           libx11-dev libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev

    #         ln -sf /usr/bin/python3.11 /usr/bin/python3

    #         # Node.js 20
    #         curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    #         apt install -y nodejs

    #         # Required by AppImageKit
    #         mkdir -p /dev
    #         mknod -m 666 /dev/fuse c 10 229 || true
    #         chmod 666 /dev/fuse || true

    #         bash ./build_appimage.sh
    #       '

    - name: Fix dist file permissions after Docker build
      if: runner.os == 'Linux'
      run: |
        sudo chmod -R a+rw ./dist

    - name: Rename Built File
      shell: bash
      run: |
        FILE_EXT=""
        if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
          FILE_EXT=".exe"
        elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
          FILE_EXT="-x86_64.AppImage"
        fi

        FILE_PATH="./dist/${{ env.PROJECT_NAME }}${FILE_EXT}"
        if [[ ! -f "$FILE_PATH" ]]; then
          echo "❌ Built file not found: $FILE_PATH"
          exit 1
        fi

        NEW_NAME="Palworld-Pal-Editor_${{ runner.os }}_${{ env.VERSION_TAG }}_${{ env.GIT_HASH }}${FILE_EXT}"
        mv "$FILE_PATH" "./dist/$NEW_NAME"

        echo "Renamed file to: $NEW_NAME"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: "Palworld-Pal-Editor_${{ runner.os }}_${{ env.VERSION_TAG }}_${{ env.GIT_HASH }}"
        path: ./dist/
