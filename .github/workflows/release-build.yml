name: Release Build

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
      short-sha: ${{ steps.build.outputs.short-sha }}
      built-at: ${{ steps.build.outputs.built-at }}
    steps:
      - name: Set release metadata
        id: build
        shell: bash
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "short-sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "built-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            source: palworld-pal-editor.exe
            extension: .exe
          - os: macos-15-intel
            platform: macOS
            source: palworld-pal-editor
            extension: ''
          - os: ubuntu-22.04
            platform: Linux
            source: palworld-pal-editor-x86_64.AppImage
            extension: -x86_64.AppImage
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.12.2
          architecture: x64

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          package-manager-cache: false

      - name: Set build metadata
        shell: bash
        env:
          VERSION_TAG: ${{ needs.metadata.outputs.version }}
          GIT_HASH: ${{ needs.metadata.outputs.short-sha }}
          BUILD_TIME: ${{ needs.metadata.outputs.built-at }}
          REPO: ${{ github.repository }}@${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("src/palworld_pal_editor/config.py")
          source = path.read_text("utf-8")
          values = {
              "VERSION": os.environ["VERSION_TAG"],
              "RELEASE_TYPE": "RELEASE",
              "BUILD_TIME": os.environ["BUILD_TIME"],
              "GIT_HASH": os.environ["GIT_HASH"],
              "REPO": os.environ["REPO"],
          }
          for name, value in values.items():
              source, count = re.subn(
                  rf"^{name} = .*?$", f"{name} = {value!r}", source, flags=re.MULTILINE
              )
              if count != 1:
                  raise RuntimeError(f"Expected one {name} assignment, found {count}")
          path.write_text(source, "utf-8")
          PY
          echo "VERSION_TAG=${VERSION_TAG}" >> "$GITHUB_ENV"
          echo "GIT_HASH=${GIT_HASH}" >> "$GITHUB_ENV"

      - name: Install Linux runtime test dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            curl libasound2 libegl1 libgl1 libglib2.0-0 libnss3 libxcomposite1 \
            libxdamage1 libxkbcommon-x11-0 libxrandr2 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 \
            xdotool xvfb

      - name: Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build_executable.ps1

      - name: macOS build
        if: runner.os == 'macOS'
        shell: bash
        run: ./build_executable.sh

      - name: Linux AppImage build
        if: runner.os == 'Linux'
        shell: bash
        run: ./build_appimage.sh

      - name: Rename built file
        shell: bash
        env:
          SOURCE_NAME: ${{ matrix.source }}
          PLATFORM: ${{ matrix.platform }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          SOURCE_PATH="dist/${SOURCE_NAME}"
          if [[ ! -f "$SOURCE_PATH" ]]; then
            echo "Built file not found: $SOURCE_PATH" >&2
            exit 1
          fi
          ASSET_NAME="Palworld-Pal-Editor_${PLATFORM}_${VERSION_TAG}_${GIT_HASH}${EXTENSION}"
          mv "$SOURCE_PATH" "dist/$ASSET_NAME"
          echo "ASSET_PATH=dist/$ASSET_NAME" >> "$GITHUB_ENV"

      - name: Smoke-test Linux AppImage GUI
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x "$ASSET_PATH"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run --auto-servernum bash -s -- "$ASSET_PATH" <<'BASH'
          set -euo pipefail
          APPIMAGE=$1
          PORT=58081
          LOG=appimage-smoke.log
          READY_PID=''

          "$APPIMAGE" --mode gui --nocli --port "$PORT" >"$LOG" 2>&1 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 60); do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat "$LOG"
              exit 1
            fi
            RESPONSE=$(curl --fail --silent "http://127.0.0.1:${PORT}/api/ready" || true)
            if [[ -n "$RESPONSE" ]]; then
              READY_PID=$(python -c 'import json,sys; print(json.load(sys.stdin)["data"]["pid"])' <<<"$RESPONSE")
              break
            fi
            sleep 1
          done

          if [[ -z "$READY_PID" ]] || ! kill -0 "$READY_PID" 2>/dev/null; then
            cat "$LOG"
            exit 1
          fi
          if grep --quiet "Failed Launching pywebview" "$LOG"; then
            cat "$LOG"
            exit 1
          fi
          if ! timeout 30 xdotool search --sync --onlyvisible --name "Palworld Pal Editor" >/dev/null; then
            cat "$LOG"
            xdotool search --name '.*' getwindowname %@ || true
            exit 1
          fi
          BASH

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: ${{ env.ASSET_PATH }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          mapfile -t FILES < <(find release-assets -maxdepth 1 -type f -name 'Palworld-Pal-Editor_*' -print)
          if [[ ${#FILES[@]} -ne 3 ]]; then
            printf 'Expected 3 release assets, found %s\n' "${#FILES[@]}" >&2
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/Palworld-Pal-Editor_*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
          body: |
            Built from commit [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).
